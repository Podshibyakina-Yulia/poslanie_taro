<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Послание Таро — Юлия Подшибякина</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4NEL5C4HZ7"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-4NEL5C4HZ7');
</script>

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:
radial-gradient(circle at top, rgba(152,103,255,0.28), transparent 35%),
linear-gradient(180deg,#05000c 0%, #140021 100%);
color:white;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.9), transparent),
radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.7), transparent),
radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.8), transparent),
radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.9), transparent),
radial-gradient(1px 1px at 160px 30px, rgba(255,255,255,0.8), transparent);
background-repeat:repeat;
background-size:200px 200px;
opacity:0.4;
pointer-events:none;
animation:starsMove 90s linear infinite;
}

@keyframes starsMove{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}

.container{
max-width:950px;
margin:auto;
padding:30px 20px 80px;
position:relative;
z-index:2;
}

.header{
text-align:center;
margin-bottom:40px;
}

.avatar{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.12);
box-shadow:0 0 40px rgba(168,120,255,0.45);
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:68px;
margin-top:24px;
}

.subtitle{
font-size:22px;
color:#d8c9ff;
margin-top:10px;
}

.description{
max-width:700px;
margin:30px auto;
line-height:1.9;
font-size:18px;
color:#eee8ff;
}

.counter{
margin-top:18px;
font-size:17px;
color:#d8c9ff;
}

.music-btn{
margin-top:20px;
padding:14px 22px;
border:none;
border-radius:18px;
background:rgba(255,255,255,0.08);
color:white;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.music-btn:hover{
transform:scale(1.05);
}

.box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:32px;
padding:30px;
backdrop-filter:blur(12px);
margin-bottom:30px;
}

textarea{
width:100%;
height:130px;
padding:22px;
border:none;
outline:none;
resize:none;
background:rgba(255,255,255,0.06);
border-radius:24px;
color:white;
font-size:16px;
font-family:'Montserrat',sans-serif;
}

textarea::placeholder{
color:#c7b8ef;
}

.main-btn{
margin-top:22px;
width:100%;
padding:20px;
border:none;
border-radius:24px;
font-size:18px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#9e7aff,#ddd2ff);
color:#14001f;
transition:0.3s;
}

.main-btn:hover{
transform:scale(1.02);
}

.cards{
display:none;
justify-content:center;
gap:24px;
flex-wrap:wrap;
margin-top:50px;
}

.card{
width:180px;
height:320px;
perspective:1000px;
}

.card-inner{
position:relative;
width:100%;
height:100%;
transition:transform 1s;
transform-style:preserve-3d;
}

.card.open .card-inner{
transform:rotateY(180deg);
}

.card-front,
.card-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:28px;
overflow:hidden;
}

.card-front{
background:
linear-gradient(180deg,#35115a,#13001d);
display:flex;
align-items:center;
justify-content:center;
font-size:54px;
box-shadow:0 0 35px rgba(161,115,255,0.4);
}

.card-back{
transform:rotateY(180deg);
}

.card-back img{
width:100%;
height:100%;
object-fit:cover;
}

.result{
display:none;
margin-top:50px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
padding:36px;
border-radius:32px;
line-height:2;
font-size:18px;
color:#f3f0ff;
}

.result h2{
font-family:'Cormorant Garamond',serif;
font-size:44px;
text-align:center;
margin-bottom:24px;
}

.limit-message{
display:none;
margin-top:30px;
background:rgba(255,255,255,0.06);
padding:28px;
border-radius:28px;
line-height:1.8;
font-size:18px;
text-align:center;
}

.day-card-container{
display:none;
margin-top:35px;
}

</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="header">

<img src="PFOTO.jpg" class="avatar">

<h1>Послание Таро</h1>

<div class="subtitle">
от Юлии Подшибякиной ✨
</div>

<div class="description">
Задай свой вопрос пространству.  
Выбери энергию своего расклада.  
И позволь картам показать тебе главное 🌙
</div>

<div class="counter" id="counter"></div>

<button class="music-btn" onclick="toggleMusic()">
🎵 Музыка
</button>

</div>

<!-- КАРТА ДНЯ -->

<div class="box" style="text-align:center;">

<h2 style="
font-family:'Cormorant Garamond',serif;
font-size:42px;
margin-bottom:16px;
">
✨ Карта дня
</h2>

<div style="
color:#e9ddff;
line-height:1.8;
margin-bottom:24px;
font-size:17px;
">
Получай своё главное послание на сегодняшний день 🌙
</div>

<button class="main-btn" onclick="getDayCard()">
🔮 Получить карту дня
</button>

<div id="dayCardContainer" class="day-card-container"></div>

<button class="main-btn" onclick="downloadDayCard()" style="margin-top:25px;">
📥 Скачать карту дня
</button>

</div>

</div>

<script>

const tarotDeck = [

{name:'Шут',image:'cards/shut.jpg'},
{name:'Маг',image:'cards/mag.jpg'},
{name:'Жрица',image:'cards/zhritsa.jpg'},
{name:'Императрица',image:'cards/imperatritsa.jpg'},
{name:'Император',image:'cards/imperator.jpg'},
{name:'Башня',image:'cards/bashnya.jpg'},
{name:'Луна',image:'cards/luna.jpg'},
{name:'Солнце',image:'cards/solnce.jpg'},
{name:'Звезда',image:'cards/zvezda.jpg'},
{name:'Смерть',image:'cards/smert.jpg'},
{name:'Влюбленные',image:'cards/vlyublennye.jpg'},
{name:'Суд',image:'cards/sud.jpg'},
{name:'Мир',image:'cards/mir.jpg'},
{name:'Дьявол',image:'cards/dyavol.jpg'},
{name:'Умеренность',image:'cards/umerennost.jpg'}

];

let musicPlaying = false;

function toggleMusic(){

const music =
document.getElementById('bgMusic');

if(!musicPlaying){

music.play();

musicPlaying = true;

}else{

music.pause();

musicPlaying = false;

}

}

function getDayCard(){

const today = new Date().toLocaleDateString();

let savedDate =
localStorage.getItem('dayCardDate');

let savedCard =
localStorage.getItem('dayCard');

let card;

if(savedDate === today && savedCard){

card = JSON.parse(savedCard);

}else{

card =
tarotDeck[Math.floor(Math.random() * tarotDeck.length)];

localStorage.setItem(
'dayCardDate',
today
);

localStorage.setItem(
'dayCard',
JSON.stringify(card)
);

}

const messages = [

'Сегодня пространство показывает, что тебе особенно важно прислушиваться к своему внутреннему состоянию.',

'Эта карта связана с важными внутренними изменениями, которые уже постепенно начинают происходить.',

'Сегодня пространство словно пытается показать тебе направление, куда сейчас особенно важно двигаться.',

'Эта карта говорит о состоянии, которое сейчас особенно сильно влияет на твою жизнь.',

'Сегодня особенно важно обращать внимание на свои эмоции, внутренние ощущения и знаки пространства.'

];

const randomMessage =
messages[Math.floor(Math.random() * messages.length)];

const container =
document.getElementById('dayCardContainer');

container.style.display = 'block';

container.innerHTML = `

<div id="storyCard" style="
background:
radial-gradient(circle at top, rgba(165,120,255,0.25), transparent 35%),
linear-gradient(180deg,#12001f 0%, #05000c 100%);
padding:50px 40px;
border-radius:40px;
text-align:center;
box-shadow:0 0 50px rgba(165,120,255,0.35);
position:relative;
overflow:hidden;
">

<div style="
position:absolute;
inset:0;
background:
radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px);
background-size:35px 35px;
opacity:0.08;
"></div>

<h2 style="
font-family:'Cormorant Garamond',serif;
font-size:54px;
margin-bottom:35px;
position:relative;
z-index:2;
">
✨ Карта дня
</h2>

<div style="
display:flex;
justify-content:center;
margin-bottom:35px;
position:relative;
z-index:2;
">

<img src="${card.image}" style="
width:270px;
border-radius:28px;
box-shadow:0 0 45px rgba(170,120,255,0.5);
">

</div>

<div style="
font-size:34px;
margin-bottom:24px;
font-weight:600;
color:#f3eaff;
position:relative;
z-index:2;
">
${card.name}
</div>

<div style="
line-height:2;
font-size:21px;
color:#e8dcff;
max-width:650px;
margin:auto;
position:relative;
z-index:2;
">

${randomMessage}

</div>

<div style="
margin-top:45px;
font-size:18px;
opacity:0.8;
position:relative;
z-index:2;
">
🌙 Послание Таро — Юлия Подшибякина
</div>

</div>

`;

container.scrollIntoView({
behavior:'smooth'
});

}

async function downloadDayCard(){

const card =
document.getElementById('storyCard');

const canvas =
await html2canvas(card, {

scale:2,
useCORS:true

});

const link =
document.createElement('a');

link.download = 'karta-dnya.png';

link.href =
canvas.toDataURL('image/png');

link.click();

}

</script>

</body>
</html>
