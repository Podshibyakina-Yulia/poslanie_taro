<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Послание Таро — Юлия Подшибякина</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:
radial-gradient(circle at top, rgba(152,103,255,0.28), transparent 35%),
linear-gradient(180deg,#05000c 0%, #140021 100%);
color:white;
overflow-x:hidden;
min-height:100vh;
}

.container{
max-width:950px;
margin:auto;
padding:30px 20px 80px;
}

.header{
text-align:center;
margin-bottom:40px;
}

.avatar{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.12);
box-shadow:0 0 40px rgba(168,120,255,0.45);
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:64px;
margin-top:24px;
}

.subtitle{
font-size:22px;
color:#d8c9ff;
margin-top:10px;
}

.description{
max-width:700px;
margin:30px auto;
line-height:1.9;
font-size:18px;
color:#eee8ff;
}

.question-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:32px;
padding:30px;
backdrop-filter:blur(12px);
}

textarea{
width:100%;
height:130px;
padding:22px;
border:none;
outline:none;
resize:none;
background:rgba(255,255,255,0.06);
border-radius:24px;
color:white;
font-size:16px;
font-family:'Montserrat',sans-serif;
}

.main-btn{
margin-top:22px;
width:100%;
padding:20px;
border:none;
border-radius:24px;
font-size:18px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#9e7aff,#ddd2ff);
color:#14001f;
}

.cards{
display:none;
justify-content:center;
gap:24px;
flex-wrap:wrap;
margin-top:50px;
}

.card{
width:180px;
height:320px;
perspective:1000px;
}

.card-inner{
position:relative;
width:100%;
height:100%;
transition:transform 1s;
transform-style:preserve-3d;
}

.card.open .card-inner{
transform:rotateY(180deg);
}

.card-front,
.card-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:28px;
overflow:hidden;
}

.card-front{
background:linear-gradient(180deg,#35115a,#13001d);
display:flex;
align-items:center;
justify-content:center;
font-size:54px;
}

.card-back{
transform:rotateY(180deg);
}

.card-back img{
width:100%;
height:100%;
object-fit:cover;
}

.result{
display:none;
margin-top:50px;
background:rgba(255,255,255,0.06);
padding:36px;
border-radius:32px;
line-height:2;
font-size:18px;
}

.contact{
margin-top:40px;
text-align:center;
}

.contact-buttons{
display:flex;
flex-direction:column;
gap:14px;
margin-top:20px;
}

.contact-btn{
padding:18px;
border-radius:20px;
text-decoration:none;
font-weight:600;
font-size:17px;
}

.telegram{
background:linear-gradient(135deg,#9e7aff,#ddd2ff);
color:#14001f;
}

.max{
background:rgba(255,255,255,0.08);
color:white;
border:1px solid rgba(255,255,255,0.1);
}

</style>
</head>
<body>

<div class="container">

<div class="header">
<img src="PFOTO.jpg" class="avatar">
<h1>Послание Таро</h1>
<div class="subtitle">от Юлии Подшибякиной ✨</div>

<div class="description">
Задай свой вопрос пространству и позволь картам показать тебе главное 🌙
</div>
</div>

<div class="question-box">
<textarea id="question" placeholder="Напиши свой вопрос..."></textarea>

<button class="main-btn" onclick="startReading()">
🔮 Получить расклад
</button>
</div>

<div class="cards" id="cards"></div>

<div class="result" id="result">
<h2>Твоё послание 🌙</h2>
<div id="resultText"></div>

<div class="contact">
<h3>✨ Хочешь личный глубокий расклад от Юлии?</h3>

<div class="contact-buttons">
<a class="contact-btn telegram" href="https://t.me/podshibyakina_yuliya" target="_blank">
✨ Написать в Telegram
</a>

<a class="contact-btn max" href="https://max.ru/u/f9LHodD0cOIX_eXMjjTvHh3JNH9qGgtBEpBTIIj3X0YVu6utxYSyGRzK2Zk" target="_blank">
💫 Написать в MAX
</a>
</div>
</div>
</div>

</div>

<script>

const tarotDeck = [
{name:'Шут',image:'cards/shut.jpg'},
{name:'Маг',image:'cards/mag.jpg'},
{name:'Жрица',image:'cards/zhritsa.jpg'},
{name:'Императрица',image:'cards/imperatritsa.jpg'},
{name:'Император',image:'cards/imperator.jpg'},
{name:'Иерофант',image:'cards/ierofant.jpg'},
{name:'Влюбленные',image:'cards/vlyublennye.jpg'},
{name:'Колесница',image:'cards/kolesnitsa.jpg'},
{name:'Сила',image:'cards/sila.jpg'},
{name:'Отшельник',image:'cards/otshelnik.jpg'},
{name:'Колесо Фортуны',image:'cards/koleso-fortuny.jpg'},
{name:'Правосудие',image:'cards/pravosudie.jpg'},
{name:'Повешенный',image:'cards/poveshennyy.jpg'},
{name:'Смерть',image:'cards/smert.jpg'},
{name:'Умеренность',image:'cards/umerennost.jpg'},
{name:'Дьявол',image:'cards/dyavol.jpg'},
{name:'Башня',image:'cards/bashnya.jpg'},
{name:'Звезда',image:'cards/zvezda.jpg'},
{name:'Луна',image:'cards/luna.jpg'},
{name:'Солнце',image:'cards/solnce.jpg'},
{name:'Суд',image:'cards/sud.jpg'},
{name:'Мир',image:'cards/mir.jpg'},
{name:'Туз Жезлов',image:'cards/tuz-zhezlov.jpg'},
{name:'Двойка Жезлов',image:'cards/dvoyka-zhezlov.jpg'},
{name:'Тройка Жезлов',image:'cards/troyka-zhezlov.jpg'},
{name:'Десятка Жезлов',image:'cards/desyatka-zhezlov.jpg'},
{name:'Король Жезлов',image:'cards/korol-zhezlov.jpg'},
{name:'Королева Жезлов',image:'cards/koroleva-zhezlov.jpg'},
{name:'Туз Кубков',image:'cards/tuz-kubkov.jpg'},
{name:'Двойка Кубков',image:'cards/dvoyka-kubkov.jpg'},
{name:'Тройка Кубков',image:'cards/troyka-kubkov.jpg'},
{name:'Десятка Кубков',image:'cards/desyatka-kubkov.jpg'},
{name:'Король Кубков',image:'cards/korol-kubkov.jpg'},
{name:'Королева Кубков',image:'cards/koroleva-kubkov.jpg'},
{name:'Туз Мечей',image:'cards/tuz-mechey.jpg'},
{name:'Тройка Мечей',image:'cards/troyka-mechey.jpg'},
{name:'Пятерка Мечей',image:'cards/pyaterka-mechey.jpg'},
{name:'Десятка Мечей',image:'cards/desyatka-mechey.jpg'},
{name:'Король Мечей',image:'cards/korol-mechey.jpg'},
{name:'Королева Мечей',image:'cards/koroleva-mechey.jpg'},
{name:'Туз Пентаклей',image:'cards/tuz-pentakley.jpg'},
{name:'Тройка Пентаклей',image:'cards/troyka-pentakley.jpg'},
{name:'Пятерка Пентаклей',image:'cards/pyaterka-pentakley.jpg'},
{name:'Десятка Пентаклей',image:'cards/desyatka-pentakley.jpg'},
{name:'Король Пентаклей',image:'cards/korol-pentakley.jpg'},
{name:'Королева Пентаклей',image:'cards/koroleva-pentakley.jpg'}
];

const tarotMeanings = {
"Башня":{past:"старая система в твоей жизни уже давно начинала разрушаться.",present:"сейчас происходят сильные внутренние и внешние перемены.",future:"после этого этапа появится пространство для новой жизни."},
"Луна":{past:"часть ситуации связана со страхами и тревогой.",present:"эмоции могут мешать видеть ситуацию объективно.",future:"со временем всё станет намного яснее."},
"Императрица":{past:"тема самоценности давно была для тебя важной.",present:"сейчас начинается период роста и раскрытия.",future:"карта показывает изобилие и внутреннюю уверенность."},
"Колесо Фортуны":{past:"перемены уже начали происходить раньше, чем казалось.",present:"сейчас начинается новый цикл.",future:"ситуация способна резко измениться в лучшую сторону."},
"Солнце":{past:"у тебя уже были возможности для роста.",present:"сейчас начинается более яркий этап жизни.",future:"карта показывает успех и хорошие результаты."},
"Маг":{past:"у тебя уже были нужные ресурсы и способности.",present:"сейчас многое зависит от твоих действий.",future:"ты сможешь повлиять на ситуацию сильнее, чем думаешь."},
"Сила":{past:"ты уже проходил через эмоционально сложные этапы.",present:"сейчас важно сохранять внутреннее спокойствие.",future:"карта показывает победу через уверенность и устойчивость."},
"Туз Пентаклей":{past:"вопрос денег и стабильности давно был важен.",present:"сейчас начинается новый материальный этап.",future:"карта показывает рост дохода и новые возможности."},
"Тройка Пентаклей":{past:"ты уже вкладывал силы в развитие навыков.",present:"сейчас многое зависит от практики и опыта.",future:"карта показывает постепенный профессиональный рост."},
"Повешенный":{past:"ситуация давно требовала другого взгляда.",present:"сейчас не время торопить события.",future:"ответ придёт через переосмысление."},
"Шут":{past:"раньше многое происходило спонтанно.",present:"сейчас начинается совершенно новый этап.",future:"карта советует не бояться перемен."},
"Император":{past:"ситуация строилась на контроле и ответственности.",present:"сейчас важно принимать чёткие решения.",future:"ты сможешь укрепить свои позиции."},
"Влюбленные":{past:"в основе ситуации лежит эмоциональный выбор.",present:"сейчас многое зависит от внутренней честности.",future:"карта показывает гармонию и ясность."},
"Смерть":{past:"старый этап уже завершался.",present:"сейчас происходит глубокая трансформация.",future:"после завершения старого начнётся новый цикл."},
"Дьявол":{past:"ситуация связана со страхами или зависимостью.",present:"что‑то забирает твою энергию.",future:"карта советует освободиться от ограничений."}
};

function getRandomCards(){
const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
return shuffled.slice(0,3);
}

function generateReading(question, cards){

const card1 = tarotMeanings[cards[0].name];
const card2 = tarotMeanings[cards[1].name];
const card3 = tarotMeanings[cards[2].name];

return `

✨ Твой вопрос:
"${question}"

${cards[0].name} показывает, что корень ситуации связан с тем, что ${card1.past}

Сейчас карта ${cards[1].name} говорит о том, что ${card2.present}

Но итоговая карта — ${cards[2].name} — показывает, что ${card3.future}

🌙 Этот расклад говорит о важном внутреннем этапе, где многое постепенно меняется глубже, чем кажется на первый взгляд. Карты показывают не только внешние события, но и внутреннюю трансформацию, которая постепенно выводит тебя в совершенно новое состояние.

`;

}

function startReading(){

const question = document.getElementById('question').value;

if(question.trim() === ''){
alert('Напиши свой вопрос ✨');
return;
}

const cards = getRandomCards();

const cardsContainer = document.getElementById('cards');
cardsContainer.innerHTML = '';
cardsContainer.style.display = 'flex';

cards.forEach((card,index)=>{

const cardElement = document.createElement('div');
cardElement.className = 'card';

cardElement.innerHTML = `
<div class="card-inner">
<div class="card-front">✦</div>
<div class="card-back">
<img src="${card.image}" alt="${card.name}">
</div>
</div>
`;

cardsContainer.appendChild(cardElement);

setTimeout(()=>{
cardElement.classList.add('open');
},700 + (index * 700));

});

const message = generateReading(question, cards);

setTimeout(()=>{

const result = document.getElementById('result');
const resultText = document.getElementById('resultText');

result.style.display = 'block';
resultText.innerText = message;

result.scrollIntoView({
behavior:'smooth'
});

},3500);

}

</script>

</body>
</html>
```
