function getRandomCards(){

const shuffled = [...tarotDeck]
.sort(() => 0.5 - Math.random());

return shuffled.slice(0,3);

}

function generateMessage(cards){

const majorCards = cards.filter(card => card.type === 'major');

let intro = '🌙 Пространство показывает важный период внутренних изменений. ';

if(majorCards.length >= 2){
intro = '🔮 Выпавшие старшие арканы говорят о судьбоносном этапе и глубокой трансформации. ';
}

const meanings = cards.map(card => card.meaning);

return `
${intro}

Сейчас в твоей жизни особенно проявлены энергии:

✨ ${cards[0].name} — ${cards[0].meaning}
✨ ${cards[1].name} — ${cards[1].meaning}
✨ ${cards[2].name} — ${cards[2].meaning}

Карты показывают сочетание тем:
${meanings.join(', ')}.

Очень важно сейчас не пытаться удерживать старое состояние и позволить жизни постепенно вывести тебя в новый этап. Пространство показывает, что многие ответы уже начинают раскрываться, даже если пока ты видишь не всю картину полностью.
`;

}

function drawTarot(){

const question = document.getElementById('question').value;

if(question.trim() === ''){
alert('Напиши свой вопрос ✨');
return;
}

const cards = getRandomCards();

const result = generateMessage(cards);

cardsContainer.style.display = 'flex';

card1.innerText = cards[0].name;
card2.innerText = cards[1].name;
card3.innerText = cards[2].name;

resultBlock.scrollIntoView({behavior:'smooth'});

}
