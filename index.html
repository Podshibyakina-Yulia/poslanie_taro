```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Послание Таро — Юлия Подшибякина</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:
radial-gradient(circle at top, rgba(155,120,255,0.25), transparent 35%),
linear-gradient(180deg,#05000d 0%, #140020 100%);
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background-image:radial-gradient(rgba(255,255,255,0.25) 1px, transparent 1px);
background-size:40px 40px;
opacity:0.15;
pointer-events:none;
}

.container{
max-width:900px;
margin:auto;
padding:30px 20px 80px;
position:relative;
z-index:2;
}

.header{
text-align:center;
margin-bottom:40px;
}

.avatar{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.15);
box-shadow:0 0 40px rgba(167,121,255,0.4);
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:58px;
margin-top:24px;
}

.subtitle{
font-size:22px;
color:#d9c9ff;
margin-top:10px;
}

.description{
max-width:680px;
margin:30px auto;
line-height:1.8;
font-size:18px;
color:#ece8ff;
}

.question-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
padding:28px;
border-radius:32px;
backdrop-filter:blur(14px);
}

textarea{
width:100%;
height:130px;
border:none;
outline:none;
resize:none;
background:rgba(255,255,255,0.06);
border-radius:24px;
padding:20px;
font-size:16px;
color:white;
font-family:'Montserrat',sans-serif;
}

textarea::placeholder{
color:#b9afd7;
}

.main-btn{
margin-top:20px;
width:100%;
padding:20px;
border:none;
border-radius:24px;
font-size:18px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#9d79ff,#ddd1ff);
color:#14001f;
transition:0.3s;
}

.main-btn:hover{
transform:scale(1.02);
}

.cards{
display:none;
justify-content:center;
gap:24px;
flex-wrap:wrap;
margin-top:50px;
}

.card{
width:180px;
height:300px;
perspective:1000px;
}

.card-inner{
position:relative;
width:100%;
height:100%;
transition:transform 1s;
transform-style:preserve-3d;
}

.card.open .card-inner{
transform:rotateY(180deg);
}

.card-front,
.card-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:26px;
overflow:hidden;
}

.card-front{
background:
linear-gradient(180deg,#2b0b4c,#120019);
border:2px solid rgba(255,255,255,0.1);
box-shadow:0 0 35px rgba(161,115,255,0.35);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

.card-back{
transform:rotateY(180deg);
background:
linear-gradient(180deg,#43206c,#1a0229);
border:2px solid rgba(255,255,255,0.12);
padding:18px;
display:flex;
flex-direction:column;
justify-content:space-between;
box-shadow:0 0 40px rgba(161,115,255,0.45);
}

.card-title{
font-family:'Cormorant Garamond',serif;
font-size:28px;
}

.card-symbol{
font-size:64px;
margin:auto;
}

.card-energy{
font-size:14px;
line-height:1.6;
color:#efe9ff;
}

.result{
display:none;
margin-top:50px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
padding:36px;
border-radius:32px;
line-height:2;
font-size:18px;
color:#f3f0ff;
}

.result h2{
font-family:'Cormorant Garamond',serif;
font-size:42px;
text-align:center;
margin-bottom:24px;
}

.contact{
margin-top:40px;
text-align:center;
}

.contact-title{
font-size:22px;
margin-bottom:20px;
color:#e4d8ff;
}

.contact-buttons{
display:flex;
flex-direction:column;
gap:14px;
}

.contact-btn{
padding:18px;
border-radius:20px;
text-decoration:none;
font-weight:600;
font-size:17px;
}

.telegram{
background:linear-gradient(135deg,#9d79ff,#ddd1ff);
color:#14001f;
}

.max{
background:rgba(255,255,255,0.08);
color:white;
border:1px solid rgba(255,255,255,0.1);
}

@media(max-width:700px){

h1{
font-size:44px;
}

.card{
width:150px;
height:250px;
}

.cards{
gap:12px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">
<img src="PFOTO.jpg" class="avatar">

<h1>Послание Таро</h1>
<div class="subtitle">от Юлии Подшибякиной ✨</div>

<div class="description">
Задай свой вопрос пространству.
Выбери энергию своего расклада.
И позволь картам показать тебе главное 🌙
</div>
</div>

<div class="question-box">
<textarea id="question" placeholder="Напиши свой вопрос..."></textarea>

<button class="main-btn" onclick="startReading()">
🔮 Получить расклад
</button>
</div>

<div class="cards" id="cards"></div>

<div class="result" id="result">
<h2>Твое послание 🌙</h2>
<div id="resultText"></div>

<div class="contact">
<div class="contact-title">
✨ Хочешь личный глубокий расклад от Юлии?
</div>

<div class="contact-buttons">
<a class="contact-btn telegram" href="https://t.me/podshibyakina_yuliya" target="_blank">
✨ Написать в Telegram
</a>

<a class="contact-btn max" href="https://max.ru/u/f9LHodD0cOIX_eXMjjTvHh3JNH9qGgtBEpBTIIj3X0YVu6utxYSyGRzK2Zk" target="_blank">
💫 Написать в MAX
</a>
</div>
</div>
</div>

</div>

<script>

const tarotDeck = [
{
name:'Луна',
symbol:'🌙',
energy:'Скрытые эмоции, тревожность, внутренние сомнения.',
meaning:'Сейчас пространство показывает, что часть твоих переживаний связана со страхом будущего и внутренней нестабильностью.'
},
{
name:'Башня',
symbol:'⚡',
energy:'Резкие перемены, разрушение старого.',
meaning:'Пространство буквально выводит тебя из старого состояния. Что-то больше не может оставаться прежним.'
},
{
name:'Звезда',
symbol:'✨',
energy:'Исцеление, надежда, новый этап.',
meaning:'После сложного периода начинается восстановление. Пространство открывает тебе новый путь.'
},
{
name:'Солнце',
symbol:'☀️',
energy:'Ясность, успех, раскрытие энергии.',
meaning:'Карты показывают мощную энергию проявленности и выхода к более счастливому этапу.'
},
{
name:'Жрица',
symbol:'🔮',
energy:'Интуиция, тайные процессы.',
meaning:'Очень многое сейчас скрыто от тебя. Ответы приходят через внутренние ощущения, а не через контроль.'
},
{
name:'Императрица',
symbol:'👑',
energy:'Женская сила, изобилие.',
meaning:'Тебе важно перестать обесценивать себя. Пространство показывает раскрытие женской энергии.'
},
{
name:'Колесо Фортуны',
symbol:'🪐',
energy:'Судьбоносный поворот.',
meaning:'Сейчас начинается цикл перемен. Жизнь постепенно выводит тебя в новый этап.'
},
{
name:'Смерть',
symbol:'🖤',
energy:'Глубокая трансформация.',
meaning:'Карты говорят о завершении старого периода. Без этого обновление невозможно.'
}
];

function getRandomCards(){
const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
return shuffled.slice(0,3);
}

function startReading(){

const question = document.getElementById('question').value;

if(question.trim() === ''){
alert('Напиши свой вопрос ✨');
return;
}

const cards = getRandomCards();

const cardsContainer = document.getElementById('cards');
cardsContainer.innerHTML = '';
cardsContainer.style.display = 'flex';

cards.forEach((card,index)=>{

const cardElement = document.createElement('div');
cardElement.className = 'card';

cardElement.innerHTML = `
<div class="card-inner">
<div class="card-front">✦</div>
<div class="card-back">
<div class="card-title">${card.name}</div>
<div class="card-symbol">${card.symbol}</div>
<div class="card-energy">${card.energy}</div>
</div>
</div>
`;

cardsContainer.appendChild(cardElement);

setTimeout(()=>{
cardElement.classList.add('open');
},700 + (index * 600));

});

const fullMessage = `
🌙 Твой вопрос сейчас связан с важным внутренним переходом.

${cards[0].meaning}

${cards[1].meaning}

${cards[2].meaning}

Пространство показывает, что сейчас тебе важно не пытаться удерживать старую реальность. Очень многое начинает меняться глубже, чем кажется на первый взгляд. Этот расклад говорит о периоде внутренней трансформации, после которого твоя жизнь уже не будет ощущаться прежней.
`;

setTimeout(()=>{

const result = document.getElementById('result');
const resultText = document.getElementById('resultText');

result.style.display = 'block';
resultText.innerText = fullMessage;

result.scrollIntoView({behavior:'smooth'});

},3000);

}

</script>

</body>
</html>
