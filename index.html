<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Послание Таро от Юлии Подшибякиной</title>
</head>
<body style="background:#12001d;color:white;font-family:Arial;text-align:center;padding:40px;">

<h1>Послание Таро ✨</h1>

<img src="PFOTO.jpg" style="width:240px;height:240px;border-radius:50%;object-fit:cover;border:4px solid #8c62ff;">

<p style="max-width:500px;margin:30px auto;line-height:1.7;">
Сконцентрируйся на своём вопросе и позволь пространству показать главное 🌙
</p>

<textarea placeholder="Напиши свой вопрос..."
style="width:90%;max-width:500px;height:120px;border-radius:20px;padding:20px;background:#2a1240;color:white;border:none;"></textarea>

<br><br>

<button onclick="drawCards()" style="padding:18px 30px;border:none;border-radius:20px;background:#9f7cff;color:#14001f;font-size:18px;font-weight:bold;">
🔮 Получить послание
</button>

<script>

function drawCards() {

const question = document.querySelector("textarea").value;

if(question.trim() === "") {
alert("Напиши свой вопрос ✨");
return;
}

alert("🌙 Пространство услышало твой вопрос...\n\nСейчас начинается раскрытие послания ✨");

}

<script>

function drawCards() {

const question = document.querySelector("textarea").value;

if(question.trim() === "") {
alert("Напиши свой вопрос ✨");
return;
}

const messages = [

"🌙 Пространство показывает, что сейчас тебе важно перестать удерживать прошлое. Очень много энергии уходит в переживания и внутреннее напряжение. Карты говорят: впереди начинается новый этап, но для него нужно отпустить то, что уже завершилось.",

"✨ Сейчас вокруг тебя формируется совершенно новая энергия. Пространство показывает, что ты слишком долго сомневалась в себе и своих силах. Очень скоро ситуация начнёт меняться, если ты позволишь себе действовать смелее.",

"🔮 Карты показывают сильную эмоциональную перегруженность. Ты слишком долго несла на себе чужие переживания и ответственность. Сейчас тебе важно начать выбирать себя и своё внутреннее состояние.",

"🌙 Пространство показывает, что ответ на твой вопрос уже постепенно раскрывается. Сейчас не время торопить события. Очень многое решится в ближайшее время само, если ты перестанешь жить в постоянном напряжении."

];

const randomMessage =
messages[Math.floor(Math.random() * messages.length)];

document.body.innerHTML += `

<div style="
margin-top:40px;
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:24px;
max-width:700px;
margin-left:auto;
margin-right:auto;
line-height:1.9;
font-size:18px;
">

<h2 style="
margin-bottom:20px;
font-size:32px;
">
✨ Твоё послание
</h2>

${randomMessage}

</div>

`;

}

</script>
