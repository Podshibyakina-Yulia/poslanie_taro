<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Послание Таро от Юлии Подшибякиной</title>

<style>
body{
margin:0;
padding:0;
background:linear-gradient(180deg,#0a0014,#1d0030);
font-family:Arial,sans-serif;
color:white;
text-align:center;
}

.container{
max-width:760px;
margin:auto;
padding:30px 20px 80px;
}

.avatar{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:4px solid #9f7cff;
box-shadow:0 0 35px rgba(159,124,255,0.5);
}

h1{
font-size:42px;
margin-top:20px;
margin-bottom:10px;
}

.subtitle{
font-size:20px;
color:#d9c9ff;
margin-bottom:30px;
}

.description{
max-width:560px;
margin:30px auto;
line-height:1.8;
font-size:19px;
}

textarea{
width:90%;
max-width:560px;
height:120px;
padding:20px;
border:none;
border-radius:24px;
background:#2a1240;
color:white;
font-size:16px;
outline:none;
}

button{
margin-top:24px;
padding:18px 34px;
border:none;
border-radius:20px;
background:linear-gradient(135deg,#9f7cff,#d7c7ff);
color:#14001f;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.cards{
display:none;
justify-content:center;
gap:16px;
margin-top:45px;
flex-wrap:wrap;
}

.card{
width:130px;
height:200px;
border-radius:22px;
background:linear-gradient(180deg,#341255,#14001f);
border:2px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(159,124,255,0.3);
display:flex;
align-items:center;
justify-content:center;
padding:10px;
font-size:20px;
line-height:1.4;
font-weight:bold;
}

.result{
display:none;
margin-top:40px;
background:rgba(255,255,255,0.08);
padding:35px;
border-radius:28px;
line-height:1.9;
font-size:18px;
text-align:left;
white-space:pre-line;
}

.result h2{
text-align:center;
}

.buttons{
display:flex;
flex-direction:column;
gap:14px;
margin-top:30px;
}

.contact{
display:block;
padding:18px;
border-radius:18px;
text-decoration:none;
font-size:17px;
font-weight:bold;
text-align:center;
}

.telegram{
background:linear-gradient(135deg,#9f7cff,#d7c7ff);
color:#14001f;
}

.max{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
color:white;
}
</style>
</head>

<body>

<div class="container">

<img src="PFOTO.jpg" class="avatar" alt="Юлия">

<h1>Послание Таро</h1>
<div class="subtitle">от Юлии Подшибякиной ✨</div>

<div class="description">
Сконцентрируйся на своём вопросе и позволь пространству показать тебе главное 🌙
</div>

<textarea id="question" placeholder="Напиши свой вопрос..."></textarea>

<br>

<button onclick="drawTarot()">
🔮 Получить послание
</button>

<div class="cards" id="cards">
<div class="card" id="card1"></div>
<div class="card" id="card2"></div>
<div class="card" id="card3"></div>
</div>

<div class="result" id="result">
<h2>✨ Твоё послание</h2>

<div id="resultText"></div>

<div class="buttons">

<a class="contact telegram"
href="https://t.me/podshibyakina_yuliya"
target="_blank">
✨ Получить личный расклад в Telegram
</a>

<a class="contact max"
href="https://max.ru/u/f9LHodD0cOIX_eXMjjTvHh3JNH9qGgtBEpBTIIj3X0YVu6utxYSyGRzK2Zk"
target="_blank">
💫 Получить личный расклад в MAX
</a>

</div>

</div>

</div>

<script>

const tarotDeck = [

{name:'Луна',meaning:'скрытые эмоции, тревожность, сомнения'},
{name:'Башня',meaning:'разрушение старого и резкие перемены'},
{name:'Звезда',meaning:'надежда, исцеление и светлый период'},
{name:'Солнце',meaning:'успех, ясность и раскрытие'},
{name:'Смерть',meaning:'глубокая трансформация и завершение этапа'},
{name:'Мир',meaning:'новый уровень и завершение цикла'},
{name:'Сила',meaning:'внутренняя устойчивость и энергия'},
{name:'Колесо Фортуны',meaning:'судьбоносный поворот и изменения'},
{name:'Жрица',meaning:'интуиция и скрытые процессы'},
{name:'Императрица',meaning:'женская энергия и изобилие'},
{name:'Паж Кубков',meaning:'новые чувства и эмоциональность'},
{name:'Королева Кубков',meaning:'интуиция и чувствительность'},
{name:'Рыцарь Жезлов',meaning:'активность, страсть и движение'},
{name:'Король Пентаклей',meaning:'стабильность и финансовая устойчивость'}

];

function getCards(){
const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
return shuffled.slice(0,3);
}

function drawTarot(){

const question = document.getElementById('question').value;

if(question.trim() === ''){
alert('Напиши свой вопрос ✨');
return;
}

const cards = getCards();

document.getElementById('cards').style.display = 'flex';

document.getElementById('card1').innerText = cards[0].name;
document.getElementById('card2').innerText = cards[1].name;
document.getElementById('card3').innerText = cards[2].name;

const message = `
🌙 Пространство показывает важный период внутренних изменений.

✨ ${cards[0].name} — ${cards[0].meaning}
✨ ${cards[1].name} — ${cards[1].meaning}
✨ ${cards[2].name} — ${cards[2].meaning}

Карты говорят о глубокой трансформации и необходимости отпустить старые переживания. Сейчас тебе важно довериться жизни и своим внутренним ощущениям.
`;

document.getElementById('result').style.display = 'block';

document.getElementById('resultText').innerText = message;

document.getElementById('result').scrollIntoView({
behavior:'smooth'
});

}

</script>

</body>
</html>
