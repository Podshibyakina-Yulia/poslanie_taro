<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Послание Таро от Юлии Подшибякиной</title>
</head>
<body style="background:#12001d;color:white;font-family:Arial;text-align:center;padding:40px;">

<h1>Послание Таро ✨</h1>

<img src="PFOTO.jpg" style="width:240px;height:240px;border-radius:50%;object-fit:cover;border:4px solid #8c62ff;">

<p style="max-width:500px;margin:30px auto;line-height:1.7;">
Сконцентрируйся на своём вопросе и позволь пространству показать главное 🌙
</p>

<textarea placeholder="Напиши свой вопрос..."
style="width:90%;max-width:500px;height:120px;border-radius:20px;padding:20px;background:#2a1240;color:white;border:none;"></textarea>

<br><br>

<button onclick="drawCards()" style="padding:18px 30px;border:none;border-radius:20px;background:#9f7cff;color:#14001f;font-size:18px;font-weight:bold;">
🔮 Получить послание
</button>

<script>

function drawCards() {

const question = document.querySelector("textarea").value;

if(question.trim() === "") {
alert("Напиши свой вопрос ✨");
return;
}

alert("🌙 Пространство услышало твой вопрос...\n\nСейчас начинается раскрытие послания ✨");

}

</script>

</body>
</html>
